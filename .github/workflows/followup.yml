# Once an hour, asks the feedback site to re-send any complaint that has been
# open for more than 24 hours. Needs one repository secret named CRON_KEY
# (GitHub > Settings > Secrets and variables > Actions), set to the same value
# as CRON_KEY in the Cloudflare project.
name: 24-hour follow-up check
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ask the site to send overdue follow-ups
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -H "x-cron-key: $CRON_KEY" \
            https://feedback.chubbyscafe.com/api/cron
